<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stella · 3D exploded view</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0f2e;--card:#141a46;--ink:#e9e7ff;--mute:#9ea3d8;--line:#2a2f78;--acc:#ff7a59;--ok:#5eead4}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:12px "IBM Plex Mono",monospace;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%!important;height:100%!important}
svg.lead{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.lead line{stroke:var(--acc);stroke-width:1.2}svg.lead circle{fill:var(--acc)}
.tag{position:absolute;padding:6px 10px;border-radius:8px;background:rgba(20,26,70,.82);backdrop-filter:blur(10px);border:1px solid rgba(233,231,255,.25);white-space:nowrap;transition:opacity .4s;transform:translate(-50%,-100%);font-size:12px;pointer-events:none;z-index:5}
.tag b{font-weight:500}.tag span{color:var(--mute);margin-left:6px}
/* top bar */
#topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(12px + env(safe-area-inset-top)) 16px 0;pointer-events:none;z-index:10}
.brand{pointer-events:auto;font-weight:500;letter-spacing:.18em;font-size:11px;color:var(--mute);background:rgba(20,26,70,.72);border:1px solid var(--line);border-radius:999px;padding:10px 16px;backdrop-filter:blur(10px)}
/* battery badge — always visible, toggles the parts panel */
#batBadge{pointer-events:auto;display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 14px 8px 10px;border-radius:14px;border:1px solid var(--line);background:rgba(20,26,70,.82);backdrop-filter:blur(10px);color:var(--ink);font:inherit;cursor:pointer;box-shadow:0 4px 24px rgba(0,0,0,.35)}
#batBadge:active{transform:scale(.97)}
#batBadge svg{display:block}
#batBadge b{font-size:17px;font-weight:500;min-width:3ch;text-align:right}
/* parts panel */
#panel{position:absolute;top:0;right:0;bottom:0;width:min(320px,86vw);background:rgba(20,26,70,.94);backdrop-filter:blur(14px);border-left:1.5px solid var(--line);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));z-index:20;transition:transform .35s cubic-bezier(.32,.72,.35,1);box-shadow:-12px 0 40px rgba(0,0,0,.4)}
#panel.closed{transform:translateX(105%)}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.panel-head h4{margin:0;font:500 11px "IBM Plex Mono";letter-spacing:.16em;color:var(--mute)}
#collapseBtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:16px;cursor:pointer}
#collapseBtn:active{transform:scale(.94)}
#list{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
#list li{padding:12px;border-radius:10px;border:1px solid transparent;transition:background .4s,border-color .4s,opacity .4s;opacity:.6;min-height:48px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
#list li.on{opacity:1;border-color:var(--acc);background:rgba(255,122,89,.12)}
#list li b{display:block;font-weight:500;font-size:13px}#list li span{color:var(--mute);font-size:11px}
/* battery card */
.bat{margin-top:12px;border-top:1px solid var(--line);padding-top:14px;display:flex;gap:12px;align-items:center}
.bat .glyph{flex:none}
.bat .meta b{font-size:26px;font-weight:500;display:block;line-height:1.1}
.bat .meta span{color:var(--mute);font-size:11px}
/* hint */
#hint{position:absolute;left:16px;bottom:calc(14px + env(safe-area-inset-bottom));color:var(--mute);font-size:11px;background:rgba(20,26,70,.72);border:1px solid var(--line);padding:8px 12px;border-radius:999px;z-index:5;pointer-events:none}
#fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:32px;color:var(--mute);z-index:50}
@media(max-width:720px){
  .tag{font-size:11px;padding:5px 8px}
  #hint{display:none}
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:62dvh;border-left:0;border-top:1.5px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.45)}
  #panel.closed{transform:translateY(105%)}
}
</style></head><body>
<div id="app">
  <div id="stage"></div>
  <svg class="lead" id="leaders"><line id="ln"/><circle id="dt" r="3.5"/></svg>
  <div class="tag" id="tag" style="opacity:0"></div>
  <header id="topbar">
    <div class="brand">STELLA · 3D</div>
    <button id="batBadge" aria-label="Battery status — tap to show parts" aria-expanded="false">
      <svg id="badgeGlyph" width="34" height="20" viewBox="0 0 34 20" aria-hidden="true"></svg>
      <b id="pct">–</b>
    </button>
  </header>
  <aside id="panel" class="closed" aria-label="Parts list">
    <div class="panel-head"><h4>PARTS</h4><button id="collapseBtn" aria-label="Close parts panel">✕</button></div>
    <ul id="list"></ul>
    <div class="bat">
      <svg id="cardGlyph" class="glyph" width="52" height="30" viewBox="0 0 34 20" aria-hidden="true"></svg>
      <div class="meta"><b id="pct2">–</b><span id="chargeLabel">charging</span></div>
    </div>
  </aside>
  <div id="hint">drag to orbit · scroll to zoom</div>
  <div id="fallback"><p>WebGL or the 3D library failed to load.<br>Check your connection and reload.</p></div>
</div>
<script>
window.__stella3d = false;
setTimeout(function(){ if(!window.__stella3d) document.getElementById('fallback').style.display='flex'; }, 9000);
</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
window.__stella3d = true;

/* ---------- params ---------- */
const q = new URLSearchParams(location.search);
const PCT = Math.max(0, Math.min(100, +(q.get('pct') || 64)));   // battery %
const FIX = q.has('t') ? +q.get('t') : null;                     // fixed frame (screenshots)
const CHARGING = q.get('charging') !== '0';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- battery color: red <20 · amber <50 · teal <80 · mint 100 ---------- */
const STOPS = [[0,'#ff4d5e'],[0.2,'#ff4d5e'],[0.5,'#ffb84d'],[0.8,'#5eead4'],[1,'#8affc1']];
function battColor(p, out){
  out = out || new THREE.Color();
  const x = p/100;
  for(let i=1;i<STOPS.length;i++){
    if(x <= STOPS[i][0]){
      const [x0,c0] = STOPS[i-1], [x1,c1] = STOPS[i];
      const t = (x-x0)/Math.max(1e-6,(x1-x0));
      return out.set(c0).lerp(new THREE.Color(c1), t);
    }
  }
  return out.set(STOPS[STOPS.length-1][1]);
}
const batt = battColor(PCT);
const battCss = '#'+batt.getHexString();

/* ---------- battery glyphs (SVG) ---------- */
function glyphSVG(pct, color){
  const w = 26, fill = Math.max(0, Math.min(w, w*pct/100));
  return `<rect x="1" y="1" width="28" height="18" rx="4" fill="none" stroke="#e9e7ff" stroke-opacity=".55" stroke-width="1.6"/>`+
    `<rect x="30.5" y="6.5" width="3" height="7" rx="1.5" fill="#e9e7ff" fill-opacity=".55"/>`+
    `<rect x="4" y="4" width="${fill.toFixed(1)}" height="12" rx="2" fill="${color}"/>`;
}
badgeGlyph.innerHTML = glyphSVG(PCT, battCss);
cardGlyph.innerHTML = glyphSVG(PCT, battCss);
cardGlyph.setAttribute('viewBox','0 0 34 20');
pct.textContent = PCT+'%';
pct2.textContent = PCT+'%';
pct.style.color = battCss;
chargeLabel.textContent = CHARGING ? 'charging · full in ' + Math.max(1, Math.round((100-PCT)*0.9)) + ' min' : 'on battery';

/* ---------- panel toggle (collapsed by default everywhere; badge is the toggle) ---------- */
const panel = document.getElementById('panel');
const batBadge = document.getElementById('batBadge');
function setPanel(open){
  panel.classList.toggle('closed', !open);
  batBadge.setAttribute('aria-expanded', String(open));
  batBadge.setAttribute('aria-label', open ? 'Battery status — tap to hide parts' : 'Battery status — tap to show parts');
}
batBadge.addEventListener('click', ()=> setPanel(panel.classList.contains('closed')));
document.getElementById('collapseBtn').addEventListener('click', ()=> setPanel(false));
// desktop: sidebar starts open (and collapsible); mobile: collapsed, badge is the toggle
if(matchMedia('(min-width:721px)').matches) setPanel(true);

/* ---------- three.js scene ---------- */
const stage = document.getElementById('stage');
let renderer;
try{
  renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
}catch(e){
  document.getElementById('fallback').style.display='flex';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(32, 1, 1, 8000);
scene.add(new THREE.HemisphereLight(0xfff8ee, 0x3a4270, 0.9));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.4); sun.position.set(-300, 600, -240); scene.add(sun);
const battLight = new THREE.PointLight(batt.getHex(), 9000, 2200, 1.8); battLight.position.set(0, 120, 0); scene.add(battLight);

/* shared wireframe materials — tinted by battery level */
const fillMat = new THREE.MeshBasicMaterial({color: batt.clone(), transparent:true, opacity:0.10, depthWrite:false});
const edgeMat = new THREE.LineBasicMaterial({color: 0xdfe0ff, transparent:true, opacity:0.85});
const accentMat = new THREE.LineBasicMaterial({color: batt.clone(), transparent:true, opacity:0.9});

function wire(geo, opts){
  opts = opts || {};
  const g = new THREE.Group();
  const m = new THREE.Mesh(geo, opts.fill===false ? new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}) : fillMat);
  g.add(m);
  g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, opts.threshold||22), opts.accent ? accentMat : edgeMat));
  return g;
}

/* ---------- Stella model (clean primitives, vertical stack) ---------- */
const parts = {};   // name -> Group
const baseY = {};   // name -> assembled y

function addPart(name, group, y){
  group.position.y = y;
  scene.add(group);
  parts[name] = group; baseY[name] = y;
  return group;
}

/* wheels — clean torus tire + cylinder hub + axle, reads as a wheel */
function makeWheel(){
  const g = new THREE.Group();
  const tire = wire(new THREE.TorusGeometry(46, 15, 12, 40), {threshold:12});
  tire.rotation.y = Math.PI/2;                       // axle along X
  g.add(tire);
  const hub = wire(new THREE.CylinderGeometry(17, 17, 34, 20), {threshold:12});
  hub.rotation.z = Math.PI/2;
  g.add(hub);
  for(let i=0;i<3;i++){                              // spokes
    const s = wire(new THREE.BoxGeometry(6, 76, 8), {threshold:12, fill:false});
    s.rotation.x = i*Math.PI/3;
    g.add(s);
  }
  return g;
}
{
  const w = new THREE.Group();
  const wl = makeWheel(); wl.position.x = -150; w.add(wl);
  const wr = makeWheel(); wr.position.x =  150; w.add(wr);
  const axle = wire(new THREE.CylinderGeometry(8, 8, 300, 12), {fill:false});
  axle.rotation.z = Math.PI/2; w.add(axle);
  addPart('wheels', w, -78);
}
/* roomba base puck */
addPart('roomba', wire(new THREE.CylinderGeometry(168, 176, 62, 56)), 0);
/* clear deck plate */
{
  const p = wire(new THREE.CylinderGeometry(150, 150, 9, 56));
  p.children[0].material = new THREE.MeshBasicMaterial({color: batt.clone(), transparent:true, opacity:0.06, depthWrite:false});
  addPart('plate', p, 44);
}
/* small power parts on the deck */
addPart('buck', wire(new THREE.BoxGeometry(52, 22, 38)), 62);   // DROK buck
parts['buck'].position.x = -70; parts['buck'].position.z = 40;
addPart('xh', wire(new THREE.BoxGeometry(44, 20, 34)), 62);      // XH-M609
parts['xh'].position.x = 72; parts['xh'].position.z = 44;
/* arduino mega */
addPart('mega', wire(new THREE.BoxGeometry(102, 16, 54)), 84);
/* raspberry pi 4 */
{
  const pi = wire(new THREE.BoxGeometry(86, 12, 58), {accent:true});
  parts['pi'] = pi; baseY['pi'] = 104; pi.position.y = 104; scene.add(pi);
  pi.position.x = -8; pi.position.z = -6;
}
/* pi camera: board + lens */
{
  const c = new THREE.Group();
  c.add(wire(new THREE.BoxGeometry(40, 6, 40)));
  const lens = wire(new THREE.CylinderGeometry(11, 13, 16, 20), {threshold:12});
  lens.position.y = 10; c.add(lens);
  c.position.set(66, 122, -52);
  parts['camera'] = c; baseY['camera'] = 122; scene.add(c);
}
/* 16x2 lcd */
{
  const l = wire(new THREE.BoxGeometry(82, 9, 38));
  l.position.set(-58, 122, 58);
  parts['lcd'] = l; baseY['lcd'] = 122; scene.add(l);
}
/* rplidar c1 tower */
{
  const l = new THREE.Group();
  l.add(wire(new THREE.CylinderGeometry(36, 38, 34, 28), {threshold:12}));
  const head = wire(new THREE.CylinderGeometry(30, 30, 12, 28), {threshold:12, accent:true});
  head.position.y = 24; l.add(head);
  l.position.y = 148;
  parts['lidar'] = l; baseY['lidar'] = 148; scene.add(l);
}

/* explode map: clean vertical layers, even 82-unit spacing; wheels drop below */
const LIFT = {wheels:-110, roomba:0, plate:82, buck:164, xh:164, mega:246, pi:328, camera:410, lcd:410, lidar:492};

/* ---------- parts list ---------- */
const SHOW = [
  ['lidar','RPLIDAR C1','maps the room'],
  ['lcd','16x2 LCD','status'],
  ['camera','Pi Camera','sees ahead'],
  ['pi','Raspberry Pi 4','the brain'],
  ['mega','Arduino Mega','talks to the Roomba'],
  ['buck','DROK buck','5.15 V for the Pi'],
  ['xh','XH-M609','low-battery cutoff'],
  ['plate','Clear deck','holds it all'],
  ['wheels','Wheels','drive + dock'],
  ['roomba','Roomba 694','the base'],
];
const list = document.getElementById('list');
list.innerHTML = SHOW.map(s=>`<li data-part="${s[0]}"><b>${s[1]}</b><span>${s[2]}</span></li>`).join('');
list.addEventListener('click', ev=>{
  const li = ev.target.closest('li'); if(!li) return;
  spotlight = li.dataset.part; spotlightT = 0;
});

/* ---------- camera orbit (pointer) ---------- */
let az = 0.8, el = 0.42, dist = 1250, tAz = az, tEl = el, tDist = dist;
let dragging=false, px=0, py=0, pinch=0;
const elc = renderer.domElement;
elc.style.touchAction='none';
elc.addEventListener('pointerdown', e=>{dragging=true;px=e.clientX;py=e.clientY;elc.setPointerCapture(e.pointerId);});
elc.addEventListener('pointermove', e=>{
  if(!dragging) return;
  tAz -= (e.clientX-px)*0.005; tEl = Math.max(0.08, Math.min(1.2, tEl-(e.clientY-py)*0.004));
  px=e.clientX; py=e.clientY;
});
addEventListener('pointerup', ()=> dragging=false);
elc.addEventListener('wheel', e=>{e.preventDefault(); tDist = Math.max(700, Math.min(2400, tDist + e.deltaY));}, {passive:false});

/* ---------- resize ---------- */
function resize(){
  const w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight;
  renderer.setSize(w, h, false);
  cam.aspect = w/h; cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ---------- leader-line spotlight ---------- */
const ln = document.getElementById('ln'), dt = document.getElementById('dt'), tag = document.getElementById('tag');
const bb = new THREE.Box3(), v = new THREE.Vector3();
let spotlight = null, spotlightT = 0;
const CYCLE = 34, HOLD = 5;   // 34 s loop: 5 s assembled, explode, hold, reassemble
const ease = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;

function explodeAmount(t){
  // 0..1..0 across the loop with eased ramps — mechanical, no drift
  if(t < HOLD) return 0;
  if(t < HOLD+4) return ease((t-HOLD)/4);
  if(t < CYCLE-4) return 1;
  return 1-ease((t-(CYCLE-4))/4);
}

function frame(t){
  const tt = t % CYCLE;
  const e = reduce ? 1 : explodeAmount(tt);

  for(const k in parts){
    parts[k].position.y = baseY[k] + (LIFT[k]||0)*e;
  }

  // camera dollies out as the stack separates
  const want = 1150 + 620*e;
  if(reduce){ az=0.8; }
  else { tAz += 0.00045; }
  az += (tAz-az)*0.06; el += (tEl-el)*0.08; dist += (Math.max(want,tDist)-dist)*0.05;
  const cx = Math.cos(az)*Math.cos(el)*dist, cy = Math.sin(el)*dist + 170, cz = Math.sin(az)*Math.cos(el)*dist;
  cam.position.set(cx, cy, cz); cam.lookAt(0, 190, 0);

  // charging pulse on the battery-tinted glow
  const pulse = (CHARGING && !reduce) ? 0.035*Math.sin(t*3.2) : 0;
  fillMat.opacity = 0.10 + pulse + 0.06*e;
  battLight.intensity = 9000 + (CHARGING && !reduce ? 2600*Math.sin(t*3.2)*0.5+1300 : 0);

  renderer.render(scene, cam);

  /* spotlight: cycle through parts while exploded, or honor a tap */
  const step = (CYCLE-HOLD-8)/SHOW.length;
  let idx = -1;
  if(spotlight){
    spotlightT += 1/60;
    idx = SHOW.findIndex(s=>s[0]===spotlight);
    if(spotlightT > 6){ spotlight=null; idx=-1; }
  } else if(tt > HOLD+2 && tt < CYCLE-6){
    idx = Math.min(SHOW.length-1, Math.floor((tt-HOLD-2)/step));
  }
  [...list.children].forEach((li,j)=> li.classList.toggle('on', j===idx));
  if(idx >= 0 && parts[SHOW[idx][0]]){
    bb.setFromObject(parts[SHOW[idx][0]]); bb.getCenter(v); v.project(cam);
    const w = stage.clientWidth, h = stage.clientHeight;
    if(v.z < 1){
      const x=(v.x+1)/2*w, y=(1-v.y)/2*h;
      const tx=Math.min(w-80,Math.max(80,x+(x<w/2?-130:130))), ty=Math.max(56,y-84);
      ln.setAttribute('x1',x);ln.setAttribute('y1',y);ln.setAttribute('x2',tx);ln.setAttribute('y2',ty);
      dt.setAttribute('cx',x);dt.setAttribute('cy',y);
      tag.style.left=tx+'px';tag.style.top=ty+'px';
      tag.innerHTML=`<b>${SHOW[idx][1]}</b><span>${SHOW[idx][2]}</span>`;
      tag.style.opacity=1;ln.style.opacity=dt.style.opacity=1;
    } else { tag.style.opacity=0;ln.style.opacity=dt.style.opacity=0; }
  } else { tag.style.opacity=0;ln.style.opacity=dt.style.opacity=0; }
}

if(FIX !== null){ frame(FIX); document.title='ready'; }
else { const t0 = performance.now(); (function loop(){ frame((performance.now()-t0)/1000); requestAnimationFrame(loop); })(); }
</script></body></html>
