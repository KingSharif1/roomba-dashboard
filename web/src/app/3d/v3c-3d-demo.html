<script type="module">
import * as THREE from 'three';

/* ---------- params ---------- */
const q = new URLSearchParams(location.search);
const PCT = Math.max(0, Math.min(100, +(q.get('pct') || 64)));   // battery %
const FIX = q.has('t') ? +q.get('t') : null;                     // fixed frame (screenshots)
const CHARGING = q.get('charging') !== '0';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- battery color: red <20 · amber <50 · teal <80 · mint 100 ---------- */
const STOPS = [[0,'#ff4d5e'],[0.2,'#ff4d5e'],[0.5,'#ffb84d'],[0.8,'#5eead4'],[1,'#8affc1']];
function battColor(p, out){
  out = out || new THREE.Color();
  const x = p/100;
  for(let i=1;i<STOPS.length;i++){
    if(x <= STOPS[i][0]){
      const [x0,c0] = STOPS[i-1], [x1,c1] = STOPS[i];
      const t = (x-x0)/Math.max(1e-6,(x1-x0));
      return out.set(c0).lerp(new THREE.Color(c1), t);
    }
  }
  return out.set(STOPS[STOPS.length-1][1]);
}
const batt = battColor(PCT);
const battCss = '#'+batt.getHexString();

/* ---------- battery glyphs (SVG) ---------- */
function glyphSVG(pct, color, stroke){
  stroke = stroke || '#e9e7ff';
  const w = 26, fill = Math.max(0, Math.min(w, w*pct/100));
  return `<rect x="1" y="1" width="28" height="18" rx="4" fill="none" stroke="${stroke}" stroke-opacity=".55" stroke-width="1.6"/>`+
    `<rect x="30.5" y="6.5" width="3" height="7" rx="1.5" fill="${stroke}" fill-opacity=".55"/>`+
    `<rect x="4" y="4" width="${fill.toFixed(1)}" height="12" rx="2" fill="${color}"/>`;
}
function paintGlyphs(){
  const paper = document.documentElement.dataset.theme === 'paper';
  const stroke = paper ? '#2a2119' : '#e9e7ff';
  badgeGlyph.innerHTML = glyphSVG(PCT, battCss, stroke);
  cardGlyph.innerHTML = glyphSVG(PCT, battCss, stroke);
  cardGlyph.setAttribute('viewBox','0 0 34 20');
}
paintGlyphs();
pct.textContent = PCT+'%';
pct2.textContent = PCT+'%';
pct.style.color = battCss;
chargeLabel.textContent = CHARGING ? 'charging · full in ' + Math.max(1, Math.round((100-PCT)*0.9)) + ' min' : 'on battery';

/* ---------- panel toggle (collapsed by default everywhere; badge is the toggle) ---------- */
const panel = document.getElementById('panel');
const batBadge = document.getElementById('batBadge');
function setPanel(open){
  panel.classList.toggle('closed', !open);
  document.documentElement.dataset.panel = open ? 'open' : 'closed';
  batBadge.setAttribute('aria-expanded', String(open));
  batBadge.setAttribute('aria-label', open ? 'Battery status — tap to hide parts' : 'Battery status — tap to show parts');
}
batBadge.addEventListener('click', ()=> setPanel(panel.classList.contains('closed')));
document.getElementById('collapseBtn').addEventListener('click', ()=> setPanel(false));
// desktop: sidebar starts open (and collapsible); mobile and the landing embed stay closed
if(!document.documentElement.dataset.embed && matchMedia('(min-width:721px)').matches) setPanel(true);

/* ---------- three.js scene ---------- */
const stage = document.getElementById('stage');
let renderer;
try{
  renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
}catch(e){
  document.getElementById('fallback').style.display='flex';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
// Stable draw order. Sorting transparent meshes every frame swaps coplanar
// fills and edges as the camera orbits, which reads as z-fighting.
renderer.sortObjects = false;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(32, 1, 1, 8000);
scene.add(new THREE.HemisphereLight(0xfff8ee, 0x3a4270, 0.9));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.4); sun.position.set(-300, 600, -240); scene.add(sun);
const battLight = new THREE.PointLight(batt.getHex(), 9000, 2200, 1.8); battLight.position.set(0, 120, 0); scene.add(battLight);

/* shared wireframe materials — tinted by battery level */
const fillMat = new THREE.MeshBasicMaterial({
  color: batt.clone(), transparent:true, opacity:0.10, depthWrite:false,
  polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1,
});
const edgeMat = new THREE.LineBasicMaterial({color: 0xdfe0ff, transparent:true, opacity:0.85});
const accentMat = new THREE.LineBasicMaterial({color: batt.clone(), transparent:true, opacity:0.9});

/* Screen-space wipe. One shared progress drives every material, so the
   color drain stays in lockstep without reallocating anything per frame. */
const wipeU = {
  uMix: { value: 0 },
  uResolution: { value: new THREE.Vector2(1, 1) },
};
const blueLight = new THREE.Color(0x7ee7ff);
let wipeKey = 0;
function installWipe(material, blueHex, blueOpacity){
  const key = 'wipe' + (++wipeKey);
  const uBlueColor = { value: new THREE.Color(blueHex) };
  const uBlueOpacity = { value: blueOpacity };
  material.onBeforeCompile = (shader) => {
    shader.uniforms.uMix = wipeU.uMix;
    shader.uniforms.uResolution = wipeU.uResolution;
    shader.uniforms.uBlueColor = uBlueColor;
    shader.uniforms.uBlueOpacity = uBlueOpacity;
    shader.fragmentShader = 'uniform float uMix;uniform vec2 uResolution;uniform vec3 uBlueColor;uniform float uBlueOpacity;\n' + shader.fragmentShader;
    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <color_fragment>',
      `#include <color_fragment>
      {
        float x = gl_FragCoord.x / max(uResolution.x, 1.0);
        float wiped = 1.0 - smoothstep(uMix - 0.08, uMix + 0.08, x);
        diffuseColor.rgb = mix(diffuseColor.rgb, uBlueColor, wiped);
        if (uBlueOpacity >= 0.0) diffuseColor.a = mix(diffuseColor.a, uBlueOpacity, wiped);
      }`
    );
  };
  material.customProgramCacheKey = () => key;
  material.needsUpdate = true;
}
installWipe(fillMat, 0x1a4d86, 0.22);
installWipe(edgeMat, 0xe7fbff, 1);
installWipe(accentMat, 0x7ef6ff, 1);

/* Real edges follow the page theme so the colored model stays readable
   on midnight and on cream. Blueprint is a separate model look. */
function applySceneTheme(){
  const paper = document.documentElement.dataset.theme === 'paper';
  edgeMat.color.set(paper ? 0x4a4238 : 0xdfe0ff);
  edgeMat.opacity = paper ? 0.9 : 0.85;
}
applySceneTheme();

/* Page theme (midnight / cream) is chrome only. The landing page posts it in. */
function setTheme(t){
  document.documentElement.dataset.theme = t;
  localStorage.setItem('stella-theme', t);
  paintGlyphs();
  applySceneTheme();
}
setTheme(document.documentElement.dataset.theme || 'dark');
addEventListener('message', e=>{
  const t = e.data && e.data.theme;
  if(t === 'dark' || t === 'paper') setTheme(t);
});
addEventListener('storage', e=>{
  if(e.key === 'stella-theme' && (e.newValue === 'dark' || e.newValue === 'paper')) setTheme(e.newValue);
});

const pickables = [];
function wire(geo, opts){
  opts = opts || {};
  const g = new THREE.Group();
  const ghost = opts.fill===false;
  const m = new THREE.Mesh(geo, ghost
    ? new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false})
    : fillMat);
  m.renderOrder = 1;
  // Lines and invisible spoke fills sit on the same surface as the solid mesh.
  // Raycasting them makes the hit part flicker under a still pointer.
  if(ghost) m.raycast = function(){};
  else pickables.push(m);
  g.add(m);
  const lines = new THREE.LineSegments(new THREE.EdgesGeometry(geo, opts.threshold||22), opts.accent ? accentMat : edgeMat);
  lines.renderOrder = 2;
  lines.raycast = function(){};
  g.add(lines);
  return g;
}

/* ---------- Stella model (clean primitives, vertical stack) ---------- */
const parts = {};   // name -> Group
const baseY = {};   // name -> assembled y
const wheels = [];  // wheel groups (spin around X when moving)
const model = new THREE.Group();   // whole robot — states bob/spin this
scene.add(model);

function addPart(name, group, y){
  group.position.y = y;
  model.add(group);
  parts[name] = group; baseY[name] = y;
  return group;
}

/* wheels — clean torus tire + cylinder hub + axle, reads as a wheel */
function makeWheel(){
  const g = new THREE.Group();
  const tire = wire(new THREE.TorusGeometry(46, 15, 12, 40), {threshold:12});
  tire.rotation.y = Math.PI/2;                       // axle along X
  g.add(tire);
  const hub = wire(new THREE.CylinderGeometry(17, 17, 34, 20), {threshold:12});
  hub.rotation.z = Math.PI/2;
  g.add(hub);
  for(let i=0;i<3;i++){                              // spokes
    const s = wire(new THREE.BoxGeometry(6, 76, 8), {threshold:12, fill:false});
    s.rotation.x = i*Math.PI/3;
    g.add(s);
  }
  return g;
}
{
  const w = new THREE.Group();
  const wl = makeWheel(); wl.position.x = -150; w.add(wl);
  const wr = makeWheel(); wr.position.x =  150; w.add(wr);
  wheels.push(wl, wr);
  const axle = wire(new THREE.CylinderGeometry(8, 8, 300, 12), {fill:false});
  axle.rotation.z = Math.PI/2; w.add(axle);

}

/* explode map: clean vertical layers, even 82-unit spacing; wheels drop below */
const LIFT = {wheels:-110, roomba:0, plate:82, buck:164, xh:164, mega:246, pi:328, camera:410, lcd:410, lidar:492};

/* ---------- view presets + robot state ---------- */
let robotState = 'charger';        // charger | idle | moving | cleaning | stuck
let currentView = 'threeq';
let modelView = 'real';            // real | blueprint — not the page theme
let explodeHold = null;            // null = auto loop, 0/1 = manual hold
let camTween = null;
const easeIO = x => x<.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2;
const LOOK_SECONDS = 1.0;
let lookFrom = 0, lookTo = 0, lookT0 = 0, lookBusy = false, nowSec = 0;
const wash = document.getElementById('wash');
function syncWash(v){ wash.style.transform = 'scaleX(' + v + ')'; }
const VIEW_LABEL = {front:'Front', top:'Top', side:'Side', threeq:'¾', run:'Run', dock:'Dock', exploded:'Exploded'};
const STATE_LABEL = {charger:'Charging', idle:'Idle', cleaning:'Cleaning', moving:'Moving', stuck:'Stuck'};
function paintMenuSummary(){
  const embed = document.documentElement.dataset.embed;
  const view = modelView === 'blueprint' ? 'Blueprint' : 'Real';
  const bits = embed ? [view, STATE_LABEL[robotState]] : [VIEW_LABEL[currentView] || '¾', view, STATE_LABEL[robotState]];
  menuSummary.textContent = bits.join(' · ');
  menuBtn.setAttribute('aria-label', 'Model controls, ' + bits.join(', '));
}
const VIEWS = {
  front:    {az: 0,            el: 0.30, dist: 1320},
  top:      {az: 0.8,          el: 1.32, dist: 1520},
  side:     {az: Math.PI/2,    el: 0.30, dist: 1320},
  threeq:   {az: 0.8,          el: 0.42, dist: 1250},
  run:      {az: -0.95,        el: 0.34, dist: 980},
  dock:     {az: 0.15,         el: 0.62, dist: 860},
  exploded: {az: 0.8,          el: 0.52, dist: 1800, explode: 1},
};
function flyTo(name){
  const v = VIEWS[name]; if(!v) return;
  currentView = name;
  camTween = {az0: tAz, el0: tEl, d0: tDist, az1: v.az, el1: v.el, d1: v.dist, t: 0};
  explodeHold = (v.explode !== undefined) ? v.explode : null;
  document.querySelectorAll('[data-view]').forEach(b=>
    b.setAttribute('aria-checked', String(b.dataset.view === name)));
  paintMenuSummary();
}
function setState(s){
  robotState = s;
  document.querySelectorAll('[data-state]').forEach(b=>
    b.setAttribute('aria-checked', String(b.dataset.state === s)));
  paintMenuSummary();
}
function setModelView(name){
  const nextName = name === 'blueprint' ? 'blueprint' : 'real';
  const next = nextName === 'blueprint' ? 1 : 0;
  modelView = nextName;
  document.documentElement.dataset.model = nextName;
  document.querySelectorAll('[data-model]').forEach(b=>
    b.setAttribute('aria-checked', String(b.dataset.model === nextName)));
  if(reduce || Math.abs(wipeU.uMix.value - next) < 0.001){
    wipeU.uMix.value = next;
    lookBusy = false;
    syncWash(next);
  } else {
    lookFrom = wipeU.uMix.value;
    lookTo = next;
    lookT0 = nowSec;
    lookBusy = true;
  }
  paintMenuSummary();
}
document.querySelectorAll('[data-view]').forEach(b=>
  b.addEventListener('click', ()=> flyTo(b.dataset.view)));
document.querySelectorAll('[data-state]').forEach(b=>
  b.addEventListener('click', ()=> setState(b.dataset.state)));
document.querySelectorAll('[data-model]').forEach(b=>
  b.addEventListener('click', ()=> setModelView(b.dataset.model)));

const menuWrap = document.getElementById('menuWrap');
const menuBtn = document.getElementById('menuBtn');
const menu = document.getElementById('menu');
const menuSummary = document.getElementById('menuSummary');
function menuItems(){
  return [...menu.querySelectorAll('button')].filter(b => b.offsetParent !== null);
}
function setMenu(open){
  menuWrap.classList.toggle('open', open);
  menuBtn.setAttribute('aria-expanded', String(open));
  menu.setAttribute('aria-hidden', String(!open));
}
menuBtn.addEventListener('click', (e)=>{
  const open = !menuWrap.classList.contains('open');
  setMenu(open);
  if(open && e.detail === 0){
    const items = menuItems();
    const current = items.find(b => b.getAttribute('aria-checked') === 'true') || items[0];
    if(current) current.focus();
  }
});
addEventListener('pointerdown', (e)=>{
  if(!menuWrap.contains(e.target)) setMenu(false);
});
addEventListener('keydown', (e)=>{
  if(e.key === 'Escape' && menuWrap.classList.contains('open')){
    setMenu(false);
    menuBtn.focus();
  }
});
menu.addEventListener('keydown', (e)=>{
  const items = menuItems();
  const i = items.indexOf(document.activeElement);
  if(i < 0) return;
  if(e.key === 'ArrowDown' || e.key === 'ArrowRight'){
    e.preventDefault();
    items[(i + 1) % items.length].focus();
  } else if(e.key === 'ArrowUp' || e.key === 'ArrowLeft'){
    e.preventDefault();
    items[(i - 1 + items.length) % items.length].focus();
  } else if(e.key === 'Home'){
    e.preventDefault(); items[0].focus();
  } else if(e.key === 'End'){
    e.preventDefault(); items[items.length - 1].focus();
  }
});
paintMenuSummary();

/* ---------- parts list ---------- */
const SHOW = [
  ['lidar','RPLIDAR C1','maps the room'],
  ['lcd','16x2 LCD','status'],
  ['camera','Pi Camera','sees ahead'],
  ['pi','Raspberry Pi 4','the brain'],
  ['mega','Arduino Mega','talks to the Roomba'],
  ['buck','DROK buck','5.15 V for the Pi'],
  ['xh','XH-M609','low-battery cutoff'],
  ['plate','Clear deck','holds it all'],
  ['wheels','Wheels','drive + dock'],
  ['roomba','Roomba 694','the base'],
];
const list = document.getElementById('list');
list.innerHTML = SHOW.map(s=>`<li data-part="${s[0]}"><b>${s[1]}</b><span>${s[2]}</span></li>`).join('');
list.addEventListener('click', ev=>{
  const li = ev.target.closest('li'); if(!li) return;
  spotlight = li.dataset.part; spotlightT = 0;
});

/* ---------- camera orbit (pointer) ---------- */
let az = 0.8, el = 0.42, dist = 1250, tAz = az, tEl = el, tDist = dist;
let dragging=false, px=0, py=0, tapX=0, tapY=0;
const elc = renderer.domElement;
elc.style.touchAction='none';
const mobileView = () => matchMedia('(max-width:720px)').matches;
// Mobile orbits the body, not a point above the lidar, and cannot drop
// below a downward 3/4 — that low angle is the under-model view.
function clampElev(v){
  return mobileView() ? Math.max(0.42, Math.min(1.2, v)) : Math.max(0.08, Math.min(1.2, v));
}
elc.addEventListener('pointerdown', e=>{
  dragging=true; camTween=null; px=e.clientX; py=e.clientY; tapX=e.clientX; tapY=e.clientY;
  elc.setPointerCapture(e.pointerId);
});
elc.addEventListener('pointermove', e=>{
  if(!dragging) return;
  tAz -= (e.clientX-px)*0.005;
  tEl = clampElev(tEl-(e.clientY-py)*0.004);
  px=e.clientX; py=e.clientY;
});
addEventListener('pointerup', ()=> dragging=false);
elc.addEventListener('wheel', e=>{e.preventDefault();camTween=null;tDist = Math.max(700, Math.min(2400, tDist + e.deltaY));}, {passive:false});

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function partFromObject(obj){
  while(obj){
    for(const k in parts) if(parts[k] === obj) return k;
    obj = obj.parent;
  }
  return null;
}
elc.addEventListener('pointerup', e=>{
  dragging = false;
  if(Math.hypot(e.clientX-tapX, e.clientY-tapY) > 8) return;
  const rect = elc.getBoundingClientRect();
  if(!rect.width || !rect.height) return;
  ndc.x = ((e.clientX-rect.left)/rect.width)*2-1;
  ndc.y = -((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(ndc, cam);
  const hits = raycaster.intersectObjects(pickables, false);
  for(const hit of hits){
    const key = partFromObject(hit.object);
    if(key && SHOW.some(s=>s[0]===key)){ spotlight = key; spotlightT = 0; return; }
  }
});

/* ---------- resize ---------- */
function resize(){
  const w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight;
  renderer.setSize(w, h, false);
  wipeU.uResolution.value.set(renderer.domElement.width, renderer.domElement.height);
  cam.aspect = w/h; cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ---------- leader-line spotlight ---------- */
const ln = document.getElementById('ln'), dt = document.getElementById('dt'), tag = document.getElementById('tag');
const bb = new THREE.Box3(), v = new THREE.Vector3();
let spotlight = null, spotlightT = 0;
let tagKey = null, tagSide = 1, litIdx = -2, calloutOn = false;
let anchorX = 0, anchorY = 0, dotX = 0, dotY = 0;
function damp(cur, goal, delta, rate){
  if(!(delta > 0)) return goal;
  return cur + (goal - cur) * (1 - Math.exp(-rate * delta));
}
function hideCallout(){
  if(!calloutOn) return;
  tag.style.opacity = '0';
  ln.style.opacity = '0';
  dt.style.opacity = '0';
  calloutOn = false;
  tagKey = null;
}
const CYCLE = 34, HOLD = 5;   // 34 s loop: 5 s assembled, explode, hold, reassemble
const ease = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;

function explodeAmount(t){
  // 0..1..0 across the loop with eased ramps — mechanical, no drift
  if(t < HOLD) return 0;
  if(t < HOLD+4) return ease((t-HOLD)/4);
  if(t < CYCLE-4) return 1;
  return 1-ease((t-(CYCLE-4))/4);
}

function frame(t, delta){
  nowSec = t;
  if(lookBusy){
    const k = Math.min(1, (t - lookT0) / LOOK_SECONDS);
    const v = lookFrom + (lookTo - lookFrom) * easeIO(k);
    wipeU.uMix.value = v;
    syncWash(v);
    if(k >= 1){ wipeU.uMix.value = lookTo; syncWash(lookTo); lookBusy = false; }
  }
  const tt = t % CYCLE;
  const e = explodeHold !== null ? explodeHold : (reduce ? 1 : explodeAmount(tt));

  for(const k in parts){
    parts[k].position.y = baseY[k] + (LIFT[k]||0)*e;
  }

  /* robot status: charging, idle, cleaning pass, moving, stuck */
  const isCharging = robotState === 'charger' && CHARGING;
  let bob = 0, yaw = 0, roll = 0, sway = 0, spin = 0;
  if(!reduce && robotState === 'idle'){
    bob = Math.sin(t*1.1)*10;
    yaw = Math.sin(t*0.3)*0.05;
  } else if(!reduce && robotState === 'moving'){
    spin = 7; bob = Math.abs(Math.sin(t*7))*16; roll = Math.sin(t*7)*0.03;
  } else if(!reduce && robotState === 'cleaning'){
    spin = 11; bob = Math.abs(Math.sin(t*8))*14; roll = Math.sin(t*8)*0.045; yaw = Math.sin(t*0.65)*0.4;
  } else if(!reduce && robotState === 'stuck'){
    sway = Math.sin(t*26)*7; bob = Math.abs(Math.sin(t*16))*5; roll = Math.sin(t*20)*0.05;
  }
  if(spin) for(const w of wheels) w.rotation.x += delta*spin;
  model.position.y += (bob-model.position.y)*0.18;
  model.position.x += (sway-model.position.x)*0.22;
  model.rotation.y += (yaw-model.rotation.y)*0.12;
  model.rotation.z += (roll-model.rotation.z)*0.16;

  /* charge pad pulse */
  chargeRing.visible = isCharging;
  if(isCharging && !reduce){
    chargeRing.material.opacity = 0.28 + 0.18*Math.sin(t*3.2);
    const s = 1 + 0.04*Math.sin(t*3.2);
    chargeRing.scale.set(s, s, 1);
  }
  /* motion rings while driving */
  motionRings.forEach((r, i)=>{
    r.visible = (robotState === 'moving' || robotState === 'cleaning') && !reduce;
    if(!r.visible) return;
    const ph = ((t*0.9) + i/3) % 1;
    const s = 1 + ph*1.6;
    r.scale.set(s, s, 1);
    r.material.opacity = 0.45*(1-ph);
  });

  // camera: preset tween (smooth, eased) — user drag cancels it
  if(camTween){
    camTween.t = Math.min(1, camTween.t + delta/1.15);
    const k = easeIO(camTween.t);
    // shortest-path azimuth
    let dAz = camTween.az1 - camTween.az0;
    if(dAz > Math.PI) dAz -= 2*Math.PI;
    if(dAz < -Math.PI) dAz += 2*Math.PI;
    tAz = camTween.az0 + dAz*k;
    tEl = camTween.el0 + (camTween.el1 - camTween.el0)*k;
    tDist = camTween.d0 + (camTween.d1 - camTween.d0)*k;
    if(camTween.t >= 1) camTween = null;
  }
  tEl = clampElev(tEl);

  // camera dollies out as the stack separates
  const want = 1150 + 620*e;
  if(reduce){ az=0.8; }
  else if(!camTween){ tAz += 0.00045; }
  // smooth damping on orbit (drag to orbit, scroll to zoom)
  az += (tAz-az)*0.07; el += (tEl-el)*0.09; el = clampElev(el); dist += (Math.max(want,tDist)-dist)*0.06;
  const mobile = mobileView();
  // Phone orbit sits on the body so the lens cannot swing under the belly.
  const focusY = mobile ? 36 : 190;
  const cx = Math.cos(az)*Math.cos(el)*dist;
  const cy = mobile ? focusY + Math.sin(el)*dist : Math.sin(el)*dist + 170;
  const cz = Math.sin(az)*Math.cos(el)*dist;
  cam.position.set(cx, cy, cz); cam.lookAt(0, focusY, 0);

  // charging pulse on the battery-tinted glow
  const pulse = (isCharging && !reduce) ? 0.05*Math.sin(t*3.2) : 0;
  fillMat.opacity = 0.10 + pulse + 0.06*e;
  battLight.color.copy(batt).lerp(blueLight, wipeU.uMix.value);
  battLight.intensity = 9000 + (isCharging && !reduce ? 2600*Math.sin(t*3.2)*0.5+1300 : 0);

  renderer.render(scene, cam);

  /* spotlight: cycle through parts while exploded, or honor a tap */
  const step = (CYCLE-HOLD-8)/SHOW.length;
  let idx = -1;
  if(spotlight){
    spotlightT += delta;
    idx = SHOW.findIndex(s=>s[0]===spotlight);
    if(spotlightT > 6){ spotlight=null; idx=-1; }
  } else if(tt > HOLD+2 && tt < CYCLE-6){
    idx = Math.min(SHOW.length-1, Math.floor((tt-HOLD-2)/step));
  }
  if(idx !== litIdx){
    const kids = list.children;
    for(let j=0;j<kids.length;j++) kids[j].classList.toggle('on', j===idx);
    litIdx = idx;
  }
  const part = idx >= 0 ? parts[SHOW[idx][0]] : null;
  if(part){
    bb.setFromObject(part); bb.getCenter(v); v.project(cam);
    const w = stage.clientWidth, h = stage.clientHeight;
    if(v.z < 1){
      const x=(v.x+1)/2*w, y=(1-v.y)/2*h;
      const partId = SHOW[idx][0];
      const ratio = x / Math.max(1, w);
      const fresh = tagKey !== partId;
      if(fresh){
        tagKey = partId;
        // Side is chosen once per part, then held until the center
        // crosses well past the middle. Orbit bob used to flip it every frame.
        tagSide = ratio < 0.5 ? -1 : 1;
        tag.innerHTML = `<b>${SHOW[idx][1]}</b><span>${SHOW[idx][2]}</span>`;
      } else if(tagSide < 0 && ratio > 0.62) tagSide = 1;
      else if(tagSide > 0 && ratio < 0.38) tagSide = -1;
      const edge = w < 720 ? 120 : 80;
      const goalX = Math.min(w-edge, Math.max(edge, x + tagSide*110));
      const goalY = Math.max(w < 720 ? 72 : 56, y-84);
      if(fresh){
        anchorX = goalX; anchorY = goalY; dotX = x; dotY = y;
      } else {
        anchorX = damp(anchorX, goalX, delta, 10);
        anchorY = damp(anchorY, goalY, delta, 10);
        dotX = damp(dotX, x, delta, 18);
        dotY = damp(dotY, y, delta, 18);
      }
      ln.setAttribute('x1', dotX); ln.setAttribute('y1', dotY);
      ln.setAttribute('x2', anchorX); ln.setAttribute('y2', anchorY);
      dt.setAttribute('cx', dotX); dt.setAttribute('cy', dotY);
      tag.style.left = anchorX+'px'; tag.style.top = anchorY+'px';
      if(!calloutOn){
        tag.style.opacity = '1'; ln.style.opacity = '1'; dt.style.opacity = '1';
        calloutOn = true;
      }
    } else hideCallout();
  } else hideCallout();
}

if(FIX !== null){ frame(FIX, 0); document.title='ready'; }
else { const t0 = performance.now(); let last = t0; (function loop(now){ const d = Math.min(0.05, (now-last)/1000); last = now; frame((now-t0)/1000, d); requestAnimationFrame(loop); })(t0); }
window.__stella3d = true;
