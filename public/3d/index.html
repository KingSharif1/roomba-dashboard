<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stella</title><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html[data-theme=paper] body:not(.bp){background:#efe6d2;color:#2a2119}html[data-theme=dark] body,body.bp{background:#0c0f2e!important;color:#e9e7ff}
html,body{margin:0;height:100%;overflow:hidden;font:12px/1.3 'IBM Plex Mono',ui-monospace,monospace;background:#eef1f4;color:#111}

#ui{position:fixed;top:14px;left:14px;display:flex;gap:10px;align-items:center}
button{font:inherit;border:1px solid currentColor;background:transparent;color:inherit;padding:5px 10px;border-radius:6px;cursor:pointer;opacity:.8}
button:hover{opacity:1}
input[type=range]{width:140px;accent-color:#ff7a59}
#info{position:fixed;left:14px;bottom:14px;pointer-events:none}
#info b{display:block;font-size:16px}
#info span{opacity:.7}
canvas{display:block}
</style></head><body>
<div id="ui"><button id="mode">blueprint</button><button id="spin">pause</button><label>explode <input id="ex" type="range" min="0" max="1" step="0.01" value="0"></label></div>
<div id="info"></div>
<script type="module" src="app.js?v3b"></script></body></html>
